# Reusable GitHub Actions workflow: build a Docker image, scan it, and push to GHCR.
#
# Call it from another workflow:
#
#   jobs:
#     image:
#       uses: shivanjalikaname/devops-toolkit/.github/workflows/docker-build-push.yml@main
#       with:
#         image-name: my-service
#         context: ./services/my-service
#
# Tags produced:
#   - sha-<short sha>           every build
#   - <branch name>             pushes to branches
#   - <semver> / <major.minor>  pushes of tags like v1.4.2
#   - latest                    default branch only
#
# Pull requests build and scan the image but never push it.

name: docker-build-push

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (without registry/owner)
        required: true
        type: string
      context:
        description: Docker build context
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to Dockerfile, relative to the repo root
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64
      fail-on-severity:
        description: Fail the build on vulnerabilities of this severity or higher
        required: false
        type: string
        default: CRITICAL

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once for the runner's platform so the scanner has a local image to inspect
      - name: Build for scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: ${{ inputs.fail-on-severity }}
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
