# Prometheus alert rules for Linux hosts running node_exporter.
#
# Thresholds are deliberately conservative: every alert here should be something
# a human acts on. Tune the `for:` windows before tuning thresholds - most noise
# comes from alerting on spikes instead of sustained state.
#
# Assumptions:
#   - node_exporter scraped under job="node" (change the `up` selector otherwise)
#   - an `instance` label that identifies the host
#   - systemd collector enabled (--collector.systemd) for NodeSystemdUnitFailed
#
# Usage:
#   rule_files:
#     - /etc/prometheus/rules/node-alerts.rules.yml
#
#   promtool check rules node-alerts.rules.yml
#
# Filesystem rules ignore pseudo and container overlay mounts; extend the
# fstype/mountpoint filters if your hosts have other noise (snap squashfs, nfs).

groups:
  - name: node-availability
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "node_exporter on {{ $labels.instance }} is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for 3 minutes. Host down, exporter stopped, or network/firewall change."

      - alert: NodeRebooted
        expr: (time() - node_boot_time_seconds) < 600
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} rebooted recently"
          description: "Uptime is {{ $value | humanizeDuration }}. Check whether the reboot was planned."

  - name: node-resources
    rules:
      - alert: NodeHighCpuUsage
        expr: |
          100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% on {{ $labels.instance }}"
          description: "Average CPU usage has been {{ $value | printf \"%.1f\" }}% for 15 minutes."

      - alert: NodeCpuStealHigh
        expr: |
          100 * avg by (instance) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU steal above 10% on {{ $labels.instance }}"
          description: "The hypervisor is taking {{ $value | printf \"%.1f\" }}% of CPU time. Noisy neighbour or an undersized burstable instance out of credits."

      - alert: NodeMemoryLow
        expr: |
          100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% memory available on {{ $labels.instance }}"
          description: "MemAvailable is {{ $value | printf \"%.1f\" }}% of total."

      - alert: NodeMemoryCritical
        expr: |
          100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% memory available on {{ $labels.instance }}"
          description: "MemAvailable is {{ $value | printf \"%.1f\" }}% of total. OOM killer is likely to fire."

      - alert: NodeOomKillDetected
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "OOM kill on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.0f\" }} process(es) killed by the OOM killer in the last 10 minutes. Check dmesg / journalctl -k."

      - alert: NodeSwapHeavy
        expr: |
          rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m]) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained swapping on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.0f\" }} pages/s swapped. The host is memory-starved even if MemAvailable looks fine."

  - name: node-storage
    rules:
      - alert: NodeFilesystemSpaceLow
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs",mountpoint!~"/run.*|/var/lib/docker/.+"}
            / node_filesystem_size_bytes < 15
          and node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} below 15% free"
          description: "{{ $value | printf \"%.1f\" }}% free on {{ $labels.device }}."

      - alert: NodeFilesystemSpaceCritical
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs",mountpoint!~"/run.*|/var/lib/docker/.+"}
            / node_filesystem_size_bytes < 5
          and node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} below 5% free"
          description: "{{ $value | printf \"%.1f\" }}% free on {{ $labels.device }}."

      # Fires before the static thresholds when something is writing fast.
      # The 1h lookback avoids reacting to a single large file copy.
      - alert: NodeFilesystemFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs",mountpoint!~"/run.*|/var/lib/docker/.+"}[1h], 4 * 3600) < 0
          and
          100 * node_filesystem_avail_bytes / node_filesystem_size_bytes < 40
          and node_filesystem_readonly == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} predicted full within 4h"
          description: "At the current write rate {{ $labels.device }} runs out of space in under 4 hours."

      - alert: NodeInodesLow
        expr: |
          100 * node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|ramfs|vfat"}
            / node_filesystem_files < 10
          and node_filesystem_readonly == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} below 10% free inodes"
          description: "{{ $value | printf \"%.1f\" }}% inodes free. Usually millions of small files: session dirs, mail queues, cache."

      - alert: NodeFilesystemReadOnly
        expr: |
          node_filesystem_readonly{fstype=~"ext4|xfs|btrfs"} == 1
          unless on (instance, mountpoint) node_filesystem_readonly{mountpoint=~"/boot.*"}
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is read-only"
          description: "The kernel remounted {{ $labels.device }} read-only, typically after I/O errors. Check dmesg before rebooting."

      - alert: NodeDiskIoSaturated
        expr: rate(node_disk_io_time_seconds_total{device!~"loop.*|ram.*|sr.*"}[5m]) > 0.9
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.device }} on {{ $labels.instance }} busy over 90%"
          description: "The device has been saturated for 20 minutes; expect high iowait and slow requests."

  - name: node-system
    rules:
      - alert: NodeClockSkew
        expr: |
          (node_timex_offset_seconds > 0.05 or node_timex_offset_seconds < -0.05)
          or node_timex_sync_status == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock on {{ $labels.instance }} is not in sync"
          description: "NTP offset is over 50ms or the clock is unsynchronised. Breaks TLS, Kerberos, distributed locks and log correlation."

      - alert: NodeSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "systemd unit {{ $labels.name }} failed on {{ $labels.instance }}"
          description: "Run: systemctl status {{ $labels.name }}"

      - alert: NodeConntrackNearLimit
        expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "conntrack table above 80% on {{ $labels.instance }}"
          description: "When the table fills the kernel drops new connections silently. Raise nf_conntrack_max or find the connection leak."

      - alert: NodeFileDescriptorsHigh
        expr: node_filefd_allocated / node_filefd_maximum > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "System-wide file descriptors above 80% on {{ $labels.instance }}"
          description: "{{ $value | humanizePercentage }} of fs.file-max in use."

      - alert: NodeNetworkErrors
        expr: |
          rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
            + rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m]) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Network errors on {{ $labels.instance }} {{ $labels.device }}"
          description: "{{ $value | printf \"%.1f\" }} errors/s. Bad cable/NIC, duplex mismatch or driver issue."
